name: Backtest (resolved questions, never publishes)

on:
  workflow_dispatch:
    inputs:
      step:
        description: "fetch = pull resolved questions + research (no LLM); run = forecast them"
        default: "run"
      variant:
        description: "prompt variant (baseline | structured)"
        default: "baseline"
      models:
        description: "comma list of openrouter/<id>:free (blank = main.py default)"
        default: ""
      skip:
        description: "comma list of post_ids to skip"
        default: ""
      ids:
        description: "only these post_ids (comma list, blank = all)"
        default: ""
      max_questions:
        default: "100"
      reserve:
        description: "free requests to leave for the live hourly bot today"
        default: "20"

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Fetch resolved questions
        if: ${{ inputs.step == 'fetch' }}
        run: uv run python backtest/${{ inputs.variant == 'debug' && 'debug_dump.py' || 'fetch_questions.py' }}
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
      - name: Forecast resolved questions (no publishing)
        if: ${{ inputs.step == 'run' }}
        run: >
          uv run python backtest/run_backtest.py
          --variant "${{ inputs.variant }}" --models "${{ inputs.models }}"
          --skip "${{ inputs.skip }}" --ids "${{ inputs.ids }}"
          --max-questions "${{ inputs.max_questions }}"
          --out "backtest/out/${{ inputs.variant }}.jsonl"
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MAX_LLM_CALLS_PER_DAY: "50"
          MAX_LLM_CALLS_PER_RUN: "40"
          DAILY_CALL_RESERVE: ${{ inputs.reserve }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-${{ inputs.step }}-${{ inputs.variant }}-${{ github.run_id }}
          path: |
            backtest/data/
            backtest/out/
          if-no-files-found: ignore
